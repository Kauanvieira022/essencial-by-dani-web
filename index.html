<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5fafc" />
    <meta name="description" content="Sistema web de gestão de estoque da Essencial By Dani." />
    <title>Essencial By Dani | Estoque</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-root" id="authRoot" aria-live="polite">
      <section class="auth-card system-message" role="status"><p>Verificando acesso…</p></section>
    </div>
    <div class="app-shell" id="appShell" hidden>
      <aside class="sidebar" id="sidebar">
        <button class="brand" type="button" aria-label="Essencial By Dani — início" data-view="dashboard">
          <span class="brand-name">essencial <b>by dani</b></span>
        </button>

        <div class="nav-label">Estoque</div>
        <nav class="main-nav" aria-label="Navegação principal">
          <button class="nav-item is-active" type="button" data-view="dashboard"><i class="icon" data-lucide="layout-dashboard" aria-hidden="true"></i><span>Visão geral</span></button>
          <button class="nav-item" type="button" data-view="products"><i class="icon" data-lucide="package" aria-hidden="true"></i><span>Produtos</span><span class="nav-count" id="navProductCount">0</span></button>
          <button class="nav-item" type="button" data-view="entry"><i class="icon" data-lucide="arrow-down-to-line" aria-hidden="true"></i><span>Entrada de estoque</span></button>
          <button class="nav-item" type="button" data-view="exit"><i class="icon" data-lucide="arrow-up-from-line" aria-hidden="true"></i><span>Saída de estoque</span></button>
          <button class="nav-item" type="button" data-view="reports"><i class="icon" data-lucide="chart-no-axes-combined" aria-hidden="true"></i><span>Movimentações</span></button>
        </nav>

      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="icon-button mobile-menu" id="menuToggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar"><i class="icon" data-lucide="menu" aria-hidden="true"></i></button>
          <div class="topbar-right"><span class="session-label" id="adminEmail"></span><button class="button logout-button" id="logoutButton" type="button"><i class="icon" data-lucide="log-out" aria-hidden="true"></i><span>Sair</span></button><span class="data-status" id="dataStatus"><i aria-hidden="true"></i><span>Conectando ao banco</span></span></div>
        </header>
        <div class="page-content" id="pageContent" tabindex="-1"></div>
      </main>
    </div>

    <div class="modal-root" id="modalRoot"></div>
    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
    <script src="/vendor/lucide.js"></script>
    <script type="module" src="/client/app.js"></script>
  </body>
</html>
