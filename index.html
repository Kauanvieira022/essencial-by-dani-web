<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5fafc" />
    <meta name="description" content="Protótipo web de gestão de estoque da Essencial By Dani." />
    <title>Essencial By Dani | Estoque</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#inicio" aria-label="Essencial By Dani — início" data-view="dashboard">
          <span class="brand-mark"><i class="icon" data-lucide="leaf" aria-hidden="true"></i></span>
          <span class="brand-name">essencial <b>by dani</b><small>GESTÃO DE ESTOQUE</small></span>
        </a>

        <div class="nav-label">MENU PRINCIPAL</div>
        <nav class="main-nav" aria-label="Navegação principal">
          <button class="nav-item is-active" type="button" data-view="dashboard"><i class="icon" data-lucide="layout-dashboard" aria-hidden="true"></i><span>Visão geral</span></button>
          <button class="nav-item" type="button" data-view="products"><i class="icon" data-lucide="package" aria-hidden="true"></i><span>Produtos</span><span class="nav-count" id="navProductCount">0</span></button>
          <button class="nav-item" type="button" data-view="entry"><i class="icon" data-lucide="arrow-down-to-line" aria-hidden="true"></i><span>Entrada de estoque</span></button>
          <button class="nav-item" type="button" data-view="exit"><i class="icon" data-lucide="arrow-up-from-line" aria-hidden="true"></i><span>Saída de estoque</span></button>
          <button class="nav-item" type="button" data-view="reports"><i class="icon" data-lucide="chart-no-axes-combined" aria-hidden="true"></i><span>Movimentações</span></button>
        </nav>

        <div class="sidebar-bottom">
          <div class="help-card"><span class="help-icon"><i class="icon" data-lucide="leaf" aria-hidden="true"></i></span><strong>Estoque em harmonia</strong><p>Registre cada movimento para manter seus saldos sempre organizados.</p></div>
          <div class="profile-row"><span class="avatar">D</span><span class="profile-copy"><b>Dani</b><small>Responsável pelo estoque</small></span><span class="profile-more" aria-hidden="true"><i class="icon" data-lucide="ellipsis"></i></span></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="icon-button mobile-menu" id="menuToggle" type="button" aria-label="Abrir menu"><i class="icon" data-lucide="menu" aria-hidden="true"></i></button>
          <div class="breadcrumb"><span>Essencial By Dani</span><i class="icon" data-lucide="chevron-right" aria-hidden="true"></i><b id="breadcrumbCurrent">Visão geral</b></div>
          <div class="topbar-right"><span class="demo-pill"><i></i> Protótipo demonstrativo</span><span class="topbar-divider"></span><button class="icon-button notification-button" type="button" aria-label="Notificações"><i class="icon" data-lucide="bell" aria-hidden="true"></i><i></i></button><span class="topbar-date" id="topbarDate"></span></div>
        </header>
        <div class="page-content" id="pageContent" tabindex="-1"></div>
      </main>
    </div>

    <div class="modal-root" id="modalRoot"></div>
    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
    <script src="/vendor/lucide.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
