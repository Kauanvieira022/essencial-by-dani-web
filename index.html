<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5fafc" />
    <meta name="description" content="Protótipo web de gestão de estoque da Essencial By Dani." />
    <title>Essencial By Dani | Estoque</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20.8 3.2C12.7 2.7 6.8 4.1 4 8c-2.2 3.1-.7 7.2 2.7 8.1 3.2.8 6.6-1.4 8.3-4.5-2.4 1.5-4.9 2-7.2 1.4C11.2 12.3 14.7 9 20.8 3.2Z"/><path d="M4 21c2-5.2 5.4-8.7 10.3-11"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="M3 8v9l9 5 9-5V8M12 13v9M7.5 5.5l9 5"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v15m0 0 6-6m-6 6-6-6"/><path d="M4 21h16"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V5m0 0L6 11m6-6 6 6"/><path d="M4 3h16"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19V5m0 14h17"/><path d="m7 15 4-4 3 2 6-7"/><circle cx="7" cy="15" r="1"/><circle cx="11" cy="11" r="1"/><circle cx="14" cy="13" r="1"/><circle cx="20" cy="6" r="1"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l4.2-.8L19 8.4a2.1 2.1 0 0 0-3-3L5.2 16.2 4 20Z"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5m0 3h.01"/></symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#inicio" aria-label="Essencial By Dani — início" data-view="dashboard">
          <span class="brand-mark"><svg class="icon"><use href="#i-leaf" /></svg></span>
          <span class="brand-name">essencial <b>by dani</b><small>GESTÃO DE ESTOQUE</small></span>
        </a>

        <div class="nav-label">MENU PRINCIPAL</div>
        <nav class="main-nav" aria-label="Navegação principal">
          <button class="nav-item is-active" type="button" data-view="dashboard"><svg class="icon"><use href="#i-grid" /></svg><span>Visão geral</span></button>
          <button class="nav-item" type="button" data-view="products"><svg class="icon"><use href="#i-box" /></svg><span>Produtos</span><span class="nav-count" id="navProductCount">0</span></button>
          <button class="nav-item" type="button" data-view="entry"><svg class="icon"><use href="#i-down" /></svg><span>Entrada de estoque</span></button>
          <button class="nav-item" type="button" data-view="exit"><svg class="icon"><use href="#i-up" /></svg><span>Saída de estoque</span></button>
          <button class="nav-item" type="button" data-view="reports"><svg class="icon"><use href="#i-chart" /></svg><span>Movimentações</span></button>
        </nav>

        <div class="sidebar-bottom">
          <div class="help-card"><span class="help-icon"><svg class="icon"><use href="#i-leaf" /></svg></span><strong>Estoque em harmonia</strong><p>Registre cada movimento para manter seus saldos sempre organizados.</p></div>
          <div class="profile-row"><span class="avatar">D</span><span class="profile-copy"><b>Dani</b><small>Responsável pelo estoque</small></span><span class="profile-more">•••</span></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="icon-button mobile-menu" id="menuToggle" type="button" aria-label="Abrir menu"><svg class="icon"><use href="#i-menu" /></svg></button>
          <div class="breadcrumb"><span>Essencial By Dani</span><svg class="icon"><use href="#i-chevron" /></svg><b id="breadcrumbCurrent">Visão geral</b></div>
          <div class="topbar-right"><span class="demo-pill"><i></i> Protótipo demonstrativo</span><span class="topbar-divider"></span><button class="icon-button notification-button" type="button" aria-label="Notificações"><svg class="icon"><use href="#i-bell" /></svg><i></i></button><span class="topbar-date" id="topbarDate"></span></div>
        </header>
        <div class="page-content" id="pageContent" tabindex="-1"></div>
      </main>
    </div>

    <div class="modal-root" id="modalRoot"></div>
    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
    <script src="app.js"></script>
  </body>
</html>
